[project]
name = "e_repl"
version = "0.1.0"
description = "A template for agents that act through one persistent Python REPL, with every run recorded."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "numpy>=2.0",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.3.2", "pytest-timeout", "ruff==0.14.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "src/project"]

[tool.ruff]
line-length = 121
target-version = "py313"

[tool.ruff.lint]
select = [
    "A", "B", "E", "F", "I", "RUF", "UP", "W",
    "N805", "PLR0124", "PLR1722", "RET502", "RET503", "SIM115", "PLC0415",
    "TID252", "ICN001",
]
ignore = ["F722", "B008", "UP015", "UP046", "UP047", "A005", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["harness", "project", "experiments", "tests"]

[tool.ty.environment]
python = ".venv"
python-version = "3.13"

[tool.ty.src]
include = ["harness", "src", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
filterwarnings = ["ignore::DeprecationWarning"]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
